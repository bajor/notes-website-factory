<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Freeform PDF site generator replacement</title>
  <desc id="description">The former Rust generator and incomplete tile pyramid are replaced by a TypeScript functional core that coordinates Poppler, QPDF, Sharp, a static viewer, and GitHub Pages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
      .section { font: 700 17px system-ui, sans-serif; fill: #334155; letter-spacing: 1px; }
      .label { font: 650 16px system-ui, sans-serif; fill: #0f172a; }
      .detail { font: 400 13px system-ui, sans-serif; fill: #475569; }
      .old { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .source { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .core { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .native { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .output { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Single-page Freeform PDF to static zoomable notes</text>

  <text x="60" y="115" class="section">REMOVED</text>
  <rect x="60" y="140" width="250" height="100" rx="14" class="old"/>
  <text x="185" y="180" text-anchor="middle" class="label">Rust generator</text>
  <text x="185" y="207" text-anchor="middle" class="detail">Cargo toolchain and PDF fixtures</text>
  <path d="M78 158 L292 222 M292 158 L78 222" stroke="#e11d48" stroke-width="3" opacity="0.55"/>
  <rect x="350" y="140" width="250" height="100" rx="14" class="old"/>
  <text x="475" y="180" text-anchor="middle" class="label">Partial tile levels</text>
  <text x="475" y="207" text-anchor="middle" class="detail">Non-standard Deep Zoom numbering</text>
  <path d="M368 158 L582 222 M582 158 L368 222" stroke="#e11d48" stroke-width="3" opacity="0.55"/>

  <text x="60" y="302" class="section">NEW BUILD FLOW</text>
  <rect x="60" y="330" width="175" height="105" rx="14" class="source"/>
  <text x="148" y="370" text-anchor="middle" class="label">One PDF</text>
  <text x="148" y="397" text-anchor="middle" class="detail">Any filename</text>
  <text x="148" y="417" text-anchor="middle" class="detail">Exactly one page</text>

  <rect x="285" y="330" width="205" height="105" rx="14" class="core"/>
  <text x="388" y="370" text-anchor="middle" class="label">TypeScript core</text>
  <text x="388" y="397" text-anchor="middle" class="detail">Typed geometry and URLs</text>
  <text x="388" y="417" text-anchor="middle" class="detail">Deterministic manifest</text>

  <rect x="540" y="330" width="205" height="105" rx="14" class="native"/>
  <text x="643" y="360" text-anchor="middle" class="label">Mature tools</text>
  <text x="643" y="387" text-anchor="middle" class="detail">Poppler renders PDF</text>
  <text x="643" y="407" text-anchor="middle" class="detail">QPDF extracts links</text>
  <text x="643" y="427" text-anchor="middle" class="detail">Sharp creates tiles</text>

  <rect x="795" y="330" width="155" height="105" rx="14" class="output"/>
  <text x="873" y="370" text-anchor="middle" class="label">Static site</text>
  <text x="873" y="397" text-anchor="middle" class="detail">Viewer and tiles</text>
  <text x="873" y="417" text-anchor="middle" class="detail">No source PDF</text>

  <rect x="1000" y="330" width="140" height="105" rx="14" class="output"/>
  <text x="1070" y="370" text-anchor="middle" class="label">Pages</text>
  <text x="1070" y="397" text-anchor="middle" class="detail">Phone, tablet,</text>
  <text x="1070" y="417" text-anchor="middle" class="detail">and desktop</text>

  <path d="M235 382 H276" class="arrow"/>
  <path d="M490 382 H531" class="arrow"/>
  <path d="M745 382 H786" class="arrow"/>
  <path d="M950 382 H991" class="arrow"/>

  <text x="60" y="505" class="section">INTERACTION POLICY</text>
  <rect x="60" y="530" width="1080" height="105" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="568" class="label">The rendered PDF remains visually canonical.</text>
  <text x="90" y="596" class="detail">Mouse, trackpad, touch, and pinch gestures pan and zoom a standards-compliant tile pyramid.</text>
  <text x="90" y="618" class="detail">Only PDF URI annotations create links or YouTube players. Images and screenshots never trigger URL guessing.</text>
</svg>
