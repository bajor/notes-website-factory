<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Algorithms for Slow Learners</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="viewport" tabindex="0" aria-label="Zoomable algorithm notes" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight">
      <div id="board"></div>
      <p id="status" role="status">Building the scene...</p>
    </main>
    <nav id="controls" aria-label="Board controls">
      <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" data-action="zoom-out" aria-label="Zoom out">-</button>
      <button type="button" data-action="fit">Fit</button>
      <button type="button" data-action="fullscreen">Full</button>
    </nav>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
