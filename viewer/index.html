<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Freeform Notes</title>
  </head>
  <body>
    <main id="viewer" aria-label="Zoomable Freeform notes"></main>
    <div id="status" role="status">Loading notes...</div>
    <div id="toolbar" aria-label="Viewer controls">
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">-</button>
      <button id="fit" type="button" title="Fit board">Fit</button>
      <button id="fullscreen" type="button" title="Enter fullscreen">Full</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
